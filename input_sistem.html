<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Sistem Baru - Sistem Informasi QC Instrument</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/fmlx.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  </head>
  <body>
    <div class="wrapper">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center; text-align: left;">
          <div>
            <h2 style="margin: 0;">SITRAQ</h2>
            <p style="margin: 0; font-size: 11px; color: #64748b;">Sistem Informasi QC Instrument</p>
          </div>
          <button onclick="toggleSidebar()" style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: #64748b; width: auto !important; padding: 5px; box-shadow: none !important;">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <ul class="sidebar-menu">
          <li onclick="location.href='dashboard.html'">
            <i class="fas fa-chart-line"></i> Tracking Overview
          </li>
          <li onclick="location.href='monitoring.html'">
            <i class="fas fa-chart-bar"></i> Monitoring Dashboard
          </li>
          <li class="active" onclick="location.href='input_sistem.html'">
            <i class="fas fa-plus"></i> Input Sistem Baru
          </li>
          <li onclick="location.href='update.html'">
            <i class="fas fa-check-double"></i> Update Progress QC
          </li>
          <li onclick="location.href='packing.html'">
            <i class="fas fa-box"></i> Packing Progress
          </li>
          <li onclick="location.href='email.html'">
            <i class="fas fa-envelope"></i> Email Prod. Report
          </li>
          <li onclick="location.href='audit.html'">
            <i class="fas fa-history"></i> Audit Trail Log
          </li>
        </ul>
        <div class="sidebar-footer">
          <button class="btn-danger" onclick="logoutUser()">
            <i class="fas fa-sign-out-alt"></i> Log Out
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="content-wrapper">
        <div class="dashboard-header" style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
          <button onclick="toggleSidebar()" style="background: transparent; border: none; font-size: 24px; cursor: pointer; color: #3b82f6; padding: 5px; width: auto !important; box-shadow: none !important;">
            <i class="fas fa-bars"></i>
          </button>
          <div>
            <h1 style="margin: 0">Input Sistem Baru</h1>
            <p id="welcome-message" style="margin: 0; margin-top: 5px">
              Selamat datang, <span id="nama-user" style="font-weight: 700; color: #3b82f6">Guest</span>! 👋
            </p>
          </div>
        </div>

        <section class="tab-content active">
          <div class="card">
            <div class="card-header">Registrasi Sistem Baru</div>
            <div class="card-body">
              
              <!-- SECTION 1: DETAIL SISTEM -->
              <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px;">
                <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #1e293b;">
                  <i class="fas fa-microchip" style="color: #3b82f6;"></i> Detail Sistem
                </h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                  <div>
                    <label style="font-weight: 600; color: #475569; font-size: 13px;">Produk *</label>
                    <select id="input-product" onchange="updateOptionalOptions()" style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1;">
                      <option value="NT8">NT8</option>
                      <option value="Formulator">Formulator</option>
                      <option value="RI360">RI360</option>
                    </select>
                  </div>
                  <div>
                    <label style="font-weight: 600; color: #475569; font-size: 13px;">Serial Number *</label>
                    <input type="text" id="input-sn" placeholder="Masukkan SN..." style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1;" />
                  </div>
                </div>

                <div style="margin-bottom: 15px;">
                  <label style="font-weight: 600; color: #475569; font-size: 13px;">Optional Sistem</label>
                  <select id="input-optional" style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1;">
                    <!-- Opsi akan diatur secara dinamis oleh JavaScript berdasarkan produk yang dipilih -->
                  </select>
                </div>

                <div>
                  <label style="font-weight: 600; color: #475569; font-size: 13px;">Customer</label>
                  <input type="text" id="input-customer" value="Belum ada PO" disabled style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f1f5f9; color: #64748b;" />
                </div>
              </div>

              <!-- SECTION 2: LOGISTIK & JADWAL -->
              <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px;">
                <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #1e293b;">
                  <i class="fas fa-calendar-alt" style="color: #3b82f6;"></i> Logistik & Jadwal
                </h3>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                  <div>
                    <label style="font-weight: 600; color: #475569; font-size: 13px;">Status PO</label>
                    <select id="input-status-po" onchange="toggleStatusPO()" style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1;">
                      <option value="Belum ada PO">Belum ada PO</option>
                      <option value="Ada PO">Ada PO</option>
                    </select>
                  </div>
                  <div>
                    <label style="font-weight: 600; color: #475569; font-size: 13px;">Nomor PO</label>
                    <input type="text" id="input-po" value="Belum ada PO" disabled style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f1f5f9; color: #64748b;" />
                  </div>
                </div>

                <div style="margin-bottom: 15px;">
                  <label style="font-weight: 600; color: #475569; font-size: 13px;">PIC QC</label>
                  <select id="input-pic" style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1;">
                    <option value="Arifal">Arifal</option>
                    <option value="Debora">Debora</option>
                    <option value="Febbry">Febbry</option>
                    <option value="Yanuar">Yanuar</option>
                    <option value="Bima">Bima</option>
                    <option value="Bintang">Bintang</option>
                    <option value="Hamidah">Hamidah</option>
                  </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                  <div>
                    <label style="font-weight: 600; color: #475569; font-size: 13px;">Plan Shipped</label>
                    <input type="date" id="input-plan-shipped" style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1;" />
                  </div>
                  <div>
                    <label style="font-weight: 600; color: #475569; font-size: 13px;">Start Date QC</label>
                    <input type="date" id="input-date1" style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1;" />
                  </div>
                  <div>
                    <label style="font-weight: 600; color: #475569; font-size: 13px;">End Date QC (Progres 100%)</label>
                    <input type="date" id="input-date2" disabled title="End Date hanya aktif jika progres 100%" style="width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f1f5f9; color: #64748b; cursor: not-allowed;" />
                  </div>
                </div>
              </div>

              <button class="btn-primary" onclick="simpanDataBaru()" style="width: auto;">
                <i class="fas fa-save"></i> Simpan Data
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="js/input_sistem.js"></script>
    <script type="module" src="js/idle.js"></script>
  </body>
</html>
